<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6C63FF">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>선우케어</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 헤더 -->
  <header id="app-header">
    <div class="header-left">
      <span class="baby-emoji">👶</span>
      <h1>선우케어</h1>
    </div>
    <div class="header-right">
      <span id="header-date"></span>
      <button id="btn-settings" class="icon-btn" onclick="openSettings()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
  </header>

  <!-- 메인 콘텐츠 -->
  <main id="app-content">

    <!-- ===== 홈 페이지 ===== -->
    <section id="page-home" class="page active">
      <!-- 아기 프로필 카드 -->
      <div class="profile-card">
        <div class="profile-photo" id="profile-photo" onclick="changeProfilePhoto()">
          <span class="profile-placeholder">👶</span>
          <img id="profile-img" src="" alt="" style="display:none">
        </div>
        <div class="profile-info">
          <h2 id="baby-name">선우</h2>
          <p id="baby-age">D+0</p>
        </div>
      </div>

      <!-- 오늘의 요약 -->
      <div class="summary-grid">
        <div class="summary-card feeding-card" onclick="switchTab('feeding')">
          <div class="summary-icon">🍼</div>
          <div class="summary-label">수유</div>
          <div class="summary-value" id="today-feeding">0회</div>
        </div>
        <div class="summary-card sleep-card" onclick="switchTab('sleep')">
          <div class="summary-icon">😴</div>
          <div class="summary-label">수면</div>
          <div class="summary-value" id="today-sleep">0시간</div>
        </div>
        <div class="summary-card diaper-card" onclick="switchTab('diaper')">
          <div class="summary-icon">🧷</div>
          <div class="summary-label">기저귀</div>
          <div class="summary-value" id="today-diaper">0회</div>
        </div>
        <div class="summary-card growth-card" onclick="switchTab('diary')">
          <div class="summary-icon">📔</div>
          <div class="summary-label">일기</div>
          <div class="summary-value" id="today-diary">0개</div>
        </div>
      </div>

      <!-- 오늘의 타임라인 -->
      <div class="section-header">
        <h3>오늘의 기록</h3>
      </div>
      <div id="timeline" class="timeline">
        <div class="empty-state" id="empty-timeline">
          <p>아직 오늘의 기록이 없어요</p>
          <p class="sub">아래 탭에서 기록을 시작해보세요!</p>
        </div>
      </div>
    </section>

    <!-- ===== 수유 페이지 ===== -->
    <section id="page-feeding" class="page">
      <div class="page-title">
        <h2>🍼 수유 기록</h2>
      </div>

      <!-- 수유 타이머 -->
      <div class="timer-card" id="feeding-timer-card">
        <div class="timer-display" id="feeding-timer">00:00:00</div>
        <div class="timer-label" id="feeding-timer-label">수유 시간</div>
        <div class="feeding-type-selector">
          <button class="type-btn active" data-type="breast_left" onclick="selectFeedingType(this)">🤱 왼쪽</button>
          <button class="type-btn" data-type="breast_right" onclick="selectFeedingType(this)">🤱 오른쪽</button>
          <button class="type-btn" data-type="bottle" onclick="selectFeedingType(this)">🍼 젖병</button>
          <button class="type-btn" data-type="formula" onclick="selectFeedingType(this)">🥛 분유</button>
        </div>
        <div class="amount-input" id="feeding-amount-wrap">
          <label>용량 (ml)</label>
          <input type="number" id="feeding-amount" placeholder="ml" min="0" step="10">
        </div>
        <div class="timer-controls">
          <button class="btn btn-start" id="btn-feeding-start" onclick="toggleFeedingTimer()">시작</button>
          <button class="btn btn-save" id="btn-feeding-save" onclick="saveFeedingRecord()" style="display:none">저장</button>
        </div>
      </div>

      <!-- 수유 기록 목록 -->
      <div class="section-header">
        <h3>수유 기록</h3>
      </div>
      <div id="feeding-history" class="record-list"></div>
    </section>

    <!-- ===== 수면 페이지 ===== -->
    <section id="page-sleep" class="page">
      <div class="page-title">
        <h2>😴 수면 기록</h2>
      </div>

      <!-- 수면 타이머 -->
      <div class="timer-card sleep-theme" id="sleep-timer-card">
        <div class="timer-display" id="sleep-timer">00:00:00</div>
        <div class="timer-label" id="sleep-timer-label">수면 시간</div>
        <div class="timer-controls">
          <button class="btn btn-start" id="btn-sleep-start" onclick="toggleSleepTimer()">재우기 시작</button>
          <button class="btn btn-save" id="btn-sleep-save" onclick="saveSleepRecord()" style="display:none">저장</button>
        </div>
      </div>

      <!-- 수면 기록 목록 -->
      <div class="section-header">
        <h3>수면 기록</h3>
      </div>
      <div id="sleep-history" class="record-list"></div>
    </section>

    <!-- ===== 기저귀 페이지 ===== -->
    <section id="page-diaper" class="page">
      <div class="page-title">
        <h2>🧷 기저귀 기록</h2>
      </div>

      <!-- 기저귀 빠른 기록 -->
      <div class="diaper-quick">
        <button class="diaper-btn pee" onclick="saveDiaperRecord('pee')">
          <span class="diaper-icon">💧</span>
          <span>소변</span>
        </button>
        <button class="diaper-btn poop" onclick="saveDiaperRecord('poop')">
          <span class="diaper-icon">💩</span>
          <span>대변</span>
        </button>
        <button class="diaper-btn both" onclick="saveDiaperRecord('both')">
          <span class="diaper-icon">💧💩</span>
          <span>혼합</span>
        </button>
      </div>

      <!-- 기저귀 기록 목록 -->
      <div class="section-header">
        <h3>기저귀 기록</h3>
      </div>
      <div id="diaper-history" class="record-list"></div>
    </section>

    <!-- ===== 일기 페이지 ===== -->
    <section id="page-diary" class="page">
      <div class="page-title">
        <h2>📔 선우 일기</h2>
      </div>

      <!-- 일기 작성 -->
      <div class="diary-write-card">
        <div class="diary-date-row">
          <input type="date" id="diary-date" class="diary-date-input">
        </div>
        <textarea id="diary-content" class="diary-textarea" placeholder="오늘 선우는 어떤 하루를 보냈나요?"></textarea>
        <div class="diary-photo-section">
          <div id="diary-photo-preview" class="photo-preview-grid"></div>
          <label class="photo-upload-btn" for="diary-photo-input">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            사진 추가
          </label>
          <input type="file" id="diary-photo-input" accept="image/*" multiple onchange="handleDiaryPhotos(event)" style="display:none">
        </div>
        <button class="btn btn-primary full-width" onclick="saveDiaryEntry()">일기 저장</button>
      </div>

      <!-- 일기 목록 -->
      <div class="section-header">
        <h3>일기 목록</h3>
      </div>
      <div id="diary-list" class="diary-entries"></div>
    </section>
  </main>

  <!-- 하단 네비게이션 -->
  <nav id="bottom-nav">
    <button class="nav-item active" data-tab="home" onclick="switchTab('home')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span>홈</span>
    </button>
    <button class="nav-item" data-tab="feeding" onclick="switchTab('feeding')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v4M16 2v4M6 6h12a2 2 0 012 2v2H4V8a2 2 0 012-2zM4 10h16v10a2 2 0 01-2 2H6a2 2 0 01-2-2V10z"/></svg>
      <span>수유</span>
    </button>
    <button class="nav-item" data-tab="sleep" onclick="switchTab('sleep')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      <span>수면</span>
    </button>
    <button class="nav-item" data-tab="diaper" onclick="switchTab('diaper')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M8 12h8M12 8v8"/></svg>
      <span>기저귀</span>
    </button>
    <button class="nav-item" data-tab="diary" onclick="switchTab('diary')">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
      <span>일기</span>
    </button>
  </nav>

  <!-- 설정 모달 -->
  <div id="settings-modal" class="modal" style="display:none">
    <div class="modal-overlay" onclick="closeSettings()"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>설정</h3>
        <button class="icon-btn" onclick="closeSettings()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <label>아기 이름</label>
          <input type="text" id="setting-name" value="선우" onchange="saveBabySettings()">
        </div>
        <div class="setting-item">
          <label>생년월일</label>
          <input type="date" id="setting-birthdate" onchange="saveBabySettings()">
        </div>
        <div class="setting-divider"></div>
        <div class="setting-item">
          <button class="btn btn-danger full-width" onclick="confirmDataReset()">모든 데이터 초기화</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 사진 뷰어 모달 -->
  <div id="photo-viewer" class="modal" style="display:none">
    <div class="modal-overlay" onclick="closePhotoViewer()"></div>
    <div class="photo-viewer-content">
      <button class="photo-close-btn" onclick="closePhotoViewer()">&times;</button>
      <img id="photo-viewer-img" src="" alt="">
    </div>
  </div>

  <!-- 프로필 사진 입력 (숨김) -->
  <input type="file" id="profile-photo-input" accept="image/*" onchange="handleProfilePhoto(event)" style="display:none">

  <script src="js/app.js"></script>
</body>
</html>
